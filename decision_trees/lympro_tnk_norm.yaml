  M_CD20:   { display: "CD20" }
  M_CD22:   { display: "CD22" }
  M_FMC7:   { display: "FMC7" }
  M_CD23:   { display: "CD23" }
  M_CD11C:  { display: "CD11c" }
  M_CD38:   { display: "CD38" }
  M_CD103:  { display: "CD103" }
  M_CD10:   { display: "CD10" }
  M_KAPPA:  { display: "kappa light chain", special_name: true }
  M_LAMBDA: { display: "lambda light chain", special_name: true }
  M_CD45:   { display: "CD45" }
  M_CD2:    { display: "CD2" }
  M_CD3:    { display: "CD3" }
  M_CD4:    { display: "CD4" }
  M_CD5:    { display: "CD5" }
  M_CD7:    { display: "CD7" }
  M_CD8:    { display: "CD8" }
