id: "lympro_tnk_panel_v5_standardized"
schema_version: "2.0"

purpose: >
  Deterministic panel rule pack for the combined Lymphoproliferative / T NK branch.
  One region is available (lymphocytes). Allowed populations within the region are
  B cells, T cells, and T-LGL. Multiple instances of each population are allowed.

notes:
  - This pack conforms to the main-tree preferred output contract.
  - Shared marker-state semantics and numeric precision are imported from the main tree.
  - Dynamic marker inclusion is explicit both at the panel level and the population level.
  - Inactive add-on markers are unavailable, not merely hidden.
  - No population or panel main line appends the terminal "See comment".
  - A benign panel-level fallback main line is emitted whenever no definite abnormal population is detected.

shared_refs:
  main_tree_pack_ref: "flow_cytometry_main_tree_v2"
  marker_state_enum_ref: "flow_cytometry_main_tree_v2.enums.marker_state"
  expressed_states_ref: "flow_cytometry_main_tree_v2.constants.expressed_states"
  marker_state_suffix_ref: "flow_cytometry_main_tree_v2.constants.marker_state_suffix"
  percent_precision_decimals_ref: "flow_cytometry_main_tree_v2.constants.percent_precision_decimals"
  ratio_precision_decimals_ref: "flow_cytometry_main_tree_v2.constants.ratio_precision_decimals"
  mainline_terminal_text_ref: "flow_cytometry_main_tree_v2.constants.mainline_terminal_text"

output_contract:
  produces:
    - antibody_panel_markers
    - comment_lines
    - main_line_items

ids:
  panels:
    PANEL_LYMPHOPROLIF_TLGL: "Lymphoproliferative / T NK"

  regions:
    REGION_LYMPHOCYTES: "Lymphocytes"

  populations:
    POP_B_CELLS: "B cells"
    POP_T_CELLS: "T cells"
    POP_TLGL: "T-LGL"

enums:
  fsc_size:
    - FSC_SMALL_TO_INTERMEDIATE
    - FSC_INTERMEDIATE_TO_LARGE
    - FSC_NA

  t_normality:
    - T_NORMAL
    - T_ABNORMAL

  performed_status:
    - PERFORMED_NO
    - PERFORMED_YES

  b_outcome:
    - B_MONOCLONAL
    - B_POLYCLONAL
    - B_INSUFFICIENT
    - B_NONE

  b_restricted_chain:
    - B_KAPPA
    - B_LAMBDA

